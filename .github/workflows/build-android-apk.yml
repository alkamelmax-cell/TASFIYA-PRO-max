name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Tasfiya Pro APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Build signed release when signing secrets exist
        id: build
        working-directory: android-twa
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          build_apk() {
            set +e
            "$@" 2>&1 | tee "$RUNNER_TEMP/tasfiya-gradle-build.log"
            local build_status=${PIPESTATUS[0]}
            set -e
            if [[ $build_status -ne 0 ]]; then
              echo '### Android build error' >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 160 "$RUNNER_TEMP/tasfiya-gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit $build_status
            fi
          }

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            export ANDROID_KEYSTORE_PATH="$PWD/release.keystore"
            build_apk ./gradlew --no-daemon :app:assembleRelease --stacktrace
            mkdir -p output
            cp app/build/outputs/apk/release/app-release.apk output/Tasfiya-Pro-release.apk
            echo "artifact_name=Tasfiya-Pro-release" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets are absent: producing a debug APK for installation/testing only."
            build_apk ./gradlew --no-daemon :app:assembleDebug --stacktrace
            mkdir -p output
            cp app/build/outputs/apk/debug/app-debug.apk output/Tasfiya-Pro-debug.apk
            echo "artifact_name=Tasfiya-Pro-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: android-twa/output/*.apk
          if-no-files-found: error
          retention-days: 30
