plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tasfiyapro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tasfiyapro.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.1.3'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            } else {
                // Keep the production applicationId even when no private
                // signing secrets are available locally/GitHub. A debug APK
                // uses a different package name and therefore creates a
                // different OneSignal/Firebase identity that cannot receive
                // the intended production Android push notifications.
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation 'com.onesignal:OneSignal:[5.1.0,5.2.0)'
}
