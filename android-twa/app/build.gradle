plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tasfiyapro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tasfiyapro.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // 2.5.0 is the version already verified by our GitHub build. It contains
    // WebViewFallbackActivity while avoiding new upstream compatibility changes.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
